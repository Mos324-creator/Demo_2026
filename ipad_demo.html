<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>iPad 小畫家 Demo</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    font-family: -apple-system, "PingFang HK", "Helvetica Neue", sans-serif;
    background: #f2f4f8;
    height: 100vh;
    overflow: hidden;
    touch-action: none;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    background: #ffffff;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    z-index: 20;
  }

  header h1 {
    font-size: 18px;
    color: #222;
  }

  .done-btn {
    background: #007aff;
    color: white;
    border: none;
    border-radius: 22px;
    padding: 10px 20px;
    font-size: 16px;
    font-weight: 600;
  }

  main {
    flex: 1;
    display: flex;
    position: relative;
  }

  .canvas-area {
    flex: 1;
    position: relative;
    background: white;
    overflow: hidden;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  .sticker {
    position: absolute;
    font-size: 48px;
    cursor: grab;
    touch-action: none;
    transform-origin: center;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }

  .toolbar {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.95);
    border-radius: 18px;
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    z-index: 10;
  }

  .color {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid transparent;
  }

  .color.active {
    border-color: #007aff;
  }

  .tool-btn {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 12px;
    background: #eef1f5;
    font-size: 18px;
  }

  .tool-btn.active {
    background: #007aff;
    color: white;
  }

  .sticker-bar {
    background: #ffffff;
    padding: 10px;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
    z-index: 20;
  }

  .sticker-item {
    font-size: 36px;
    background: #f1f3f7;
    border-radius: 14px;
    padding: 8px 12px;
    flex: 0 0 auto;
  }

  .result-screen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .result-card {
    background: white;
    border-radius: 20px;
    padding: 18px;
    max-width: 90%;
    max-height: 90%;
    text-align: center;
    overflow: auto;
  }

  .result-card img {
    max-width: 100%;
    max-height: 60vh;
    border-radius: 12px;
    margin-bottom: 14px;
  }

  .download-btn {
    display: inline-block;
    background: #007aff;
    color: white;
    text-decoration: none;
    padding: 12px 22px;
    border-radius: 24px;
    font-weight: 600;
  }

  .close-btn {
    margin-top: 12px;
    background: #eee;
    border: none;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 15px;
  }
</style>
</head>

<body>
<div class="app">
  <header>
    <h1>🎨 iPad 小畫家 Demo</h1>
    <button class="done-btn" id="doneBtn">完成作品</button>
  </header>

  <main>
    <div class="canvas-area" id="canvasArea">
      <canvas id="drawCanvas"></canvas>
    </div>

    <div class="toolbar">
      <div class="color active" data-color="#222222" style="background:#222222"></div>
      <div class="color" data-color="#ff3b30" style="background:#ff3b30"></div>
      <div class="color" data-color="#ff9500" style="background:#ff9500"></div>
      <div class="color" data-color="#34c759" style="background:#34c759"></div>
      <div class="color" data-color="#007aff" style="background:#007aff"></div>
      <div class="color" data-color="#af52de" style="background:#af52de"></div>

      <button class="tool-btn" id="eraserBtn">🧽</button>
      <button class="tool-btn" id="undoBtn">↩️</button>
      <button class="tool-btn" id="clearBtn">🗑️</button>
    </div>
  </main>

  <div class="sticker-bar" id="stickerBar">
    <div class="sticker-item" data-sticker="⭐">⭐</div>
    <div class="sticker-item" data-sticker="❤️">❤️</div>
    <div class="sticker-item" data-sticker="🌈">🌈</div>
    <div class="sticker-item" data-sticker="🐶">🐶</div>
    <div class="sticker-item" data-sticker="🐱">🐱</div>
    <div class="sticker-item" data-sticker="🌸">🌸</div>
    <div class="sticker-item" data-sticker="🚀">🚀</div>
    <div class="sticker-item" data-sticker="🎈">🎈</div>
    <div class="sticker-item" data-sticker="🍎">🍎</div>
    <div class="sticker-item" data-sticker="☀️">☀️</div>
  </div>
</div>

<div class="result-screen" id="resultScreen">
  <div class="result-card">
    <h2>你的作品完成啦！</h2>
    <img id="resultImage" alt="完成作品">
    <br>
    <a class="download-btn" id="downloadLink" download="my-artwork.jpg">下載圖片</a>
    <br>
    <button class="close-btn" id="closeBtn">關閉</button>
  </div>
</div>

<script>
const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d");
const canvasArea = document.getElementById("canvasArea");

let drawing = false;
let brushColor = "#222222";
let brushSize = 8;
let eraserMode = false;

let history = [];
const maxHistory = 8;

function resizeCanvas() {
  const oldData = canvas.toDataURL();

  canvas.width = canvasArea.clientWidth * devicePixelRatio;
  canvas.height = canvasArea.clientHeight * devicePixelRatio;

  ctx.scale(devicePixelRatio, devicePixelRatio);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  const img = new Image();
  img.onload = () => {
    ctx.drawImage(
      img,
      0,
      0,
      canvasArea.clientWidth,
      canvasArea.clientHeight
    );
  };
  img.src = oldData;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function getPos(event) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  };
}

function startDraw(event) {
  if (event.target.classList.contains("sticker")) return;

  drawing = true;
  saveHistory();

  const pos = getPos(event);

  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
}

function draw(event) {
  if (!drawing) return;

  const pos = getPos(event);

  ctx.strokeStyle = eraserMode ? "#ffffff" : brushColor;
  ctx.lineWidth = eraserMode ? brushSize * 3 : brushSize;

  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
}

function endDraw() {
  drawing = false;
  ctx.beginPath();
}

canvas.addEventListener("pointerdown", startDraw);
canvas.addEventListener("pointermove", draw);
canvas.addEventListener("pointerup", endDraw);
canvas.addEventListener("pointercancel", endDraw);

document.querySelectorAll(".color").forEach(item => {
  item.addEventListener("click", () => {
    document.querySelectorAll(".color").forEach(c => c.classList.remove("active"));
    item.classList.add("active");

    brushColor = item.dataset.color;
    eraserMode = false;
    document.getElementById("eraserBtn").classList.remove("active");
  });
});

document.getElementById("eraserBtn").addEventListener("click", function () {
  eraserMode = !eraserMode;
  this.classList.toggle("active", eraserMode);
});

document.getElementById("undoBtn").addEventListener("click", undo);
document.getElementById("clearBtn").addEventListener("click", clearCanvas);

function saveHistory() {
  if (history.length >= maxHistory) history.shift();

  history.push(canvas.toDataURL());
}

function undo() {
  if (history.length === 0) return;

  const last = history.pop();
  const img = new Image();

  img.onload = () => {
    ctx.clearRect(0, 0, canvasArea.clientWidth, canvasArea.clientHeight);
    ctx.drawImage(img, 0, 0, canvasArea.clientWidth, canvasArea.clientHeight);
  };

  img.src = last;
}

function clearCanvas() {
  saveHistory();
  ctx.clearRect(0, 0, canvasArea.clientWidth, canvasArea.clientHeight);
}

const stickerBar = document.getElementById("stickerBar");

stickerBar.addEventListener("click", event => {
  const item = event.target.closest(".sticker-item");
  if (!item) return;

  addSticker(item.dataset.sticker);
});

function addSticker(emoji) {
  const sticker = document.createElement("div");
  sticker.className = "sticker";
  sticker.textContent = emoji;

  sticker.style.left = "40%";
  sticker.style.top = "40%";
  sticker.style.fontSize = "56px";

  canvasArea.appendChild(sticker);
  makeStickerDraggable(sticker);
}

function makeStickerDraggable(sticker) {
  let startX = 0;
  let startY = 0;
  let startLeft = 0;
  let startTop = 0;
  let initialDistance = 0;
  let initialSize = 56;

  sticker.addEventListener("pointerdown", event => {
    event.stopPropagation();

    sticker.setPointerCapture(event.pointerId);

    startX = event.clientX;
    startY = event.clientY;

    startLeft = parseFloat(sticker.style.left);
    startTop = parseFloat(sticker.style.top);

    initialSize = parseFloat(sticker.style.fontSize);
    initialDistance = 0;
  });

  sticker.addEventListener("pointermove", event => {
    if (!sticker.hasPointerCapture(event.pointerId)) return;

    const dx = event.clientX - startX;
    const dy = event.clientY - startY;

    sticker.style.left = startLeft + dx + "px";
    sticker.style.top = startTop + dy + "px";
  });

  sticker.addEventListener("wheel", event => {
    event.preventDefault();

    const current = parseFloat(sticker.style.fontSize);
    const next = Math.min(180, Math.max(24, current - event.deltaY * 0.1));

    sticker.style.fontSize = next + "px";
  });
}

document.getElementById("doneBtn").addEventListener("click", generateResult);

function generateResult() {
  const exportCanvas = document.createElement("canvas");
  const exportCtx = exportCanvas.getContext("2d");

  const width = canvasArea.clientWidth;
  const height = canvasArea.clientHeight;

  exportCanvas.width = width * 2;
  exportCanvas.height = height * 2;

  exportCtx.fillStyle = "#ffffff";
  exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

  exportCtx.drawImage(canvas, 0, 0, exportCanvas.width, exportCanvas.height);

  document.querySelectorAll(".sticker").forEach(sticker => {
    const rect = sticker.getBoundingClientRect();
    const areaRect = canvasArea.getBoundingClientRect();

    const x = (rect.left - areaRect.left + rect.width / 2) * 2;
    const y = (rect.top - areaRect.top + rect.height / 2) * 2;

    const size = parseFloat(sticker.style.fontSize) * 2;

    exportCtx.font = size + "px sans-serif";
    exportCtx.textAlign = "center";
    exportCtx.textBaseline = "middle";
    exportCtx.fillText(sticker.textContent, x, y);
  });

  const imageURL = exportCanvas.toDataURL("image/jpeg", 0.92);

  document.getElementById("resultImage").src = imageURL;
  document.getElementById("downloadLink").href = imageURL;
  document.getElementById("resultScreen").style.display = "flex";
}

document.getElementById("closeBtn").addEventListener("click", () => {
  document.getElementById("resultScreen").style.display = "none";
});
</script>
</body>
</html>
